<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 128 128">
  <!-- The product's mark (docs/images/logo.svg): an eye whose pupil is a small graph. At tab size the
       graph's spokes are left out and its nodes drawn larger, so it still reads. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6FD8" />
      <stop offset="1" stop-color="#22357E" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#back)" />
  <path d="M12 64 Q64 14 116 64 Q64 114 12 64Z" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round" />
  <circle cx="64" cy="64" r="18" fill="#FFD166" />
</svg>
