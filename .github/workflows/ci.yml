# Install, typecheck, lint, test and build (D1).
#
# Minutes: the repository is private on GitHub's free plan, which gives about 2,000 a month, counts
# a minute on Windows twice and one on macOS ten times, and bills each job in whole minutes.
# - A push to any branch, develop included: Linux with Node 22 and 24, about 2 × 5 = 10 minutes.
# - A pull request to master, or a manual run: Linux as above, plus Windows (about 10 minutes,
#   counted 20) and macOS (about 6 minutes, counted 60): about 90 minutes.
# Tags run the Executables workflow instead.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.system }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A test that hangs stops here, not at GitHub's six hours, which on macOS would cost 3,600 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push; Windows and macOS too on a pull request to master or a manual run.
        # The lines below fold into one expression, so each keeps the same indentation.
        include: >-
          ${{ fromJSON(github.event_name == 'push' &&
          '[{"system":"Linux","os":"ubuntu-latest","node":22},{"system":"Linux","os":"ubuntu-latest","node":24}]' ||
          '[{"system":"Linux","os":"ubuntu-latest","node":22},{"system":"Linux","os":"ubuntu-latest","node":24},{"system":"Windows","os":"windows-latest","node":22},{"system":"macOS","os":"macos-latest","node":22}]') }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Ends with every test skipped on this system, and why.
      - run: pnpm test
      - run: pnpm build
